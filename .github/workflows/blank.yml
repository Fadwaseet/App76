name: HEC Android Cloud Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [customer, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          for archive in 01-android-project.zip 02-service.zip 03-web-assets.zip 04-docs-and-tests.zip; do
            test -f "$archive" || { echo "Missing $archive"; exit 1; }
            unzip -q -o "$archive" -d .
          done
          test -f build-apk.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        env:
          HEC_APP_ROLE: ${{ matrix.variant }}
          HEC_SERVICE_ORIGIN: https://hec-service-review.fadhel-motaher.chatgpt.site
        run: bash build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HEC-2.6.0-${{ matrix.variant }}
          path: build/HEC-${{ matrix.variant }}-2.6.0.apk
          if-no-files-found: error
